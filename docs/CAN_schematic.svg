<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="860" viewBox="0 0 1040 860" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1040" height="860" fill="#ffffff"/>

  <!-- Title -->
  <text x="520" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">Staircase Light Controller — CAN Option</text>
  <text x="520" y="56" font-size="13" text-anchor="middle" fill="#555">System topology + sensor-node adapter circuit · CAN 2.0 @ 500 kbps · 120 Ω at each bus end</text>

  <!-- ===================== TOPOLOGY ===================== -->
  <text x="30" y="88" font-size="16" font-weight="bold" fill="#111">1 · CAN bus topology</text>

  <!-- Bus trunk: twisted pair (CANH / CANL) -->
  <line x1="60" y1="150" x2="980" y2="150" stroke="#2c7be5" stroke-width="3"/>
  <line x1="60" y1="165" x2="980" y2="165" stroke="#e53e3e" stroke-width="3"/>
  <text x="40" y="154" font-size="11" fill="#2c7be5" text-anchor="end">CANH</text>
  <text x="40" y="169" font-size="11" fill="#e53e3e" text-anchor="end">CANL</text>

  <!-- 120 ohm terminators -->
  <rect x="52" y="142" width="8" height="31" fill="#f6ad55"/>
  <rect x="980" y="142" width="8" height="31" fill="#f6ad55"/>
  <text x="56" y="192" font-size="10" fill="#b06a10" text-anchor="middle">120Ω</text>
  <text x="984" y="192" font-size="10" fill="#b06a10" text-anchor="middle">120Ω</text>

  <!-- MAIN node -->
  <rect x="120" y="185" width="130" height="52" rx="6" fill="#e8f0fe" stroke="#2c7be5" stroke-width="2"/>
  <text x="185" y="206" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a56a8">MAIN</text>
  <text x="185" y="222" font-size="10" text-anchor="middle" fill="#333">ESP32-S3 + SN65HVD230</text>
  <line x1="185" y1="185" x2="185" y2="158" stroke="#333" stroke-width="2"/>
  <line x1="180" y1="158" x2="180" y2="150" stroke="#2c7be5" stroke-width="2"/>
  <line x1="190" y1="158" x2="190" y2="165" stroke="#e53e3e" stroke-width="2"/>
  <text x="185" y="252" font-size="10" text-anchor="middle" fill="#555">node ID 0x01</text>

  <!-- NODE A -->
  <rect x="330" y="185" width="150" height="52" rx="6" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
  <text x="405" y="206" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">NODE A</text>
  <text x="405" y="222" font-size="10" text-anchor="middle" fill="#333">VL53L0X bottom (0x10)</text>
  <line x1="405" y1="185" x2="405" y2="158" stroke="#333" stroke-width="2"/>
  <line x1="400" y1="158" x2="400" y2="150" stroke="#2c7be5" stroke-width="2"/>
  <line x1="410" y1="158" x2="410" y2="165" stroke="#e53e3e" stroke-width="2"/>

  <!-- NODE B -->
  <rect x="545" y="185" width="150" height="52" rx="6" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
  <text x="620" y="206" font-size="12" font-weight="bold" text-anchor="middle" fill="#276749">NODE B</text>
  <text x="620" y="222" font-size="10" text-anchor="middle" fill="#333">VL53L0X top (0x11)</text>
  <line x1="620" y1="185" x2="620" y2="158" stroke="#333" stroke-width="2"/>
  <line x1="615" y1="158" x2="615" y2="150" stroke="#2c7be5" stroke-width="2"/>
  <line x1="625" y1="158" x2="625" y2="165" stroke="#e53e3e" stroke-width="2"/>

  <!-- NODE C -->
  <rect x="760" y="185" width="150" height="52" rx="6" fill="#fffaf0" stroke="#d69e2e" stroke-width="2"/>
  <text x="835" y="206" font-size="12" font-weight="bold" text-anchor="middle" fill="#975a16">NODE C</text>
  <text x="835" y="222" font-size="10" text-anchor="middle" fill="#333">BH1750 ambient (0x12)</text>
  <line x1="835" y1="185" x2="835" y2="158" stroke="#333" stroke-width="2"/>
  <line x1="830" y1="158" x2="830" y2="150" stroke="#2c7be5" stroke-width="2"/>
  <line x1="840" y1="158" x2="840" y2="165" stroke="#e53e3e" stroke-width="2"/>

  <!-- ===================== NODE DETAIL ===================== -->
  <text x="30" y="310" font-size="16" font-weight="bold" fill="#111">2 · Sensor-node adapter circuit (one VL53L0X node)</text>

  <!-- ESP32 box -->
  <rect x="60" y="340" width="240" height="240" rx="8" fill="#f7fafc" stroke="#2b6cb0" stroke-width="2"/>
  <text x="180" y="365" font-size="13" font-weight="bold" text-anchor="middle" fill="#2b6cb0">ESP32 (node MCU)</text>

  <!-- ESP32 left pins (I2C + power) -->
  <g font-size="11" fill="#333">
    <text x="76" y="395">GPIO21 · SDA</text>
    <text x="76" y="420">GPIO22 · SCL</text>
    <text x="76" y="445">3V3</text>
    <text x="76" y="470">GND</text>
  </g>
  <!-- ESP32 right pins (CAN) -->
  <g font-size="11" fill="#333" text-anchor="end">
    <text x="284" y="395">GPIO5 · TX</text>
    <text x="284" y="420">GPIO4 · RX</text>
    <text x="284" y="445">3V3</text>
    <text x="284" y="470">GND</text>
  </g>

  <!-- VL53L0X box (left) -->
  <rect x="360" y="340" width="200" height="130" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
  <text x="460" y="365" font-size="13" font-weight="bold" text-anchor="middle" fill="#276749">VL53L0X (unchanged)</text>
  <g font-size="11" fill="#333">
    <text x="376" y="395">SDA</text>
    <text x="376" y="420">SCL</text>
    <text x="376" y="445">VIN (3V3)</text>
    <text x="376" y="465">GND</text>
  </g>
  <text x="460" y="430" font-size="9" text-anchor="middle" fill="#38a169" font-style="italic">local I²C · few cm</text>

  <!-- SN65HVD230 box (right) -->
  <rect x="660" y="340" width="220" height="130" rx="8" fill="#fdf2f8" stroke="#d53f8c" stroke-width="2"/>
  <text x="770" y="365" font-size="13" font-weight="bold" text-anchor="middle" fill="#97266d">SN65HVD230 (transceiver)</text>
  <g font-size="11" fill="#333">
    <text x="676" y="395">CTX / D</text>
    <text x="676" y="420">CRX / R</text>
    <text x="676" y="445">VCC (3V3)</text>
    <text x="676" y="465">GND</text>
  </g>

  <!-- Connections ESP32 -> VL53L0X -->
  <g stroke="#38a169" stroke-width="1.6">
    <line x1="300" y1="391" x2="360" y2="391"/>
    <line x1="300" y1="416" x2="360" y2="416"/>
    <line x1="300" y1="441" x2="360" y2="441"/>
    <line x1="300" y1="466" x2="360" y2="461"/>
  </g>

  <!-- Connections ESP32 -> SN65HVD230 -->
  <g stroke="#d53f8c" stroke-width="1.6">
    <line x1="300" y1="391" x2="660" y2="391"/>
    <line x1="300" y1="416" x2="660" y2="416"/>
    <line x1="300" y1="441" x2="660" y2="441"/>
    <line x1="300" y1="466" x2="660" y2="461"/>
  </g>

  <!-- CAN bus out of transceiver -->
  <line x1="880" y1="395" x2="940" y2="395" stroke="#2c7be5" stroke-width="2.5"/>
  <line x1="880" y1="420" x2="940" y2="420" stroke="#e53e3e" stroke-width="2.5"/>
  <text x="948" y="399" font-size="11" fill="#2c7be5">CANH</text>
  <text x="948" y="424" font-size="11" fill="#e53e3e">CANL</text>
  <text x="900" y="445" font-size="10" fill="#555">→ to bus</text>

  <!-- ===================== MAIN CONTROLLER ===================== -->
  <text x="30" y="650" font-size="16" font-weight="bold" fill="#111">3 · Main controller CAN interface (ESP32-S3)</text>

  <rect x="60" y="670" width="260" height="150" rx="8" fill="#ebf4ff" stroke="#2c7be5" stroke-width="2"/>
  <text x="190" y="695" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a56a8">ESP32-S3 (main)</text>
  <g font-size="11" fill="#333">
    <text x="76" y="725">GPIO17 · TX  → CTX</text>
    <text x="76" y="750">GPIO18 · RX  ← CRX</text>
    <text x="76" y="775">3V3 / GND</text>
    <text x="76" y="800">GPIO5 · LED MOSFET (PWM)</text>
  </g>

  <rect x="430" y="670" width="200" height="90" rx="8" fill="#fdf2f8" stroke="#d53f8c" stroke-width="2"/>
  <text x="530" y="695" font-size="13" font-weight="bold" text-anchor="middle" fill="#97266d">SN65HVD230</text>
  <g font-size="11" fill="#333">
    <text x="446" y="720">CTX / D</text>
    <text x="446" y="740">CRX / R</text>
  </g>
  <line x1="320" y1="721" x2="430" y2="716" stroke="#d53f8c" stroke-width="1.6"/>
  <line x1="320" y1="746" x2="430" y2="736" stroke="#d53f8c" stroke-width="1.6"/>

  <line x1="630" y1="708" x2="700" y2="708" stroke="#2c7be5" stroke-width="2.5"/>
  <line x1="630" y1="728" x2="700" y2="728" stroke="#e53e3e" stroke-width="2.5"/>
  <text x="710" y="712" font-size="11" fill="#2c7be5">CANH</text>
  <text x="710" y="732" font-size="11" fill="#e53e3e">CANL</text>

  <!-- Legend -->
  <rect x="60" y="780" width="880" height="64" rx="8" fill="#f9fafb" stroke="#ddd"/>
  <text x="80" y="800" font-size="12" font-weight="bold" fill="#111">Legend</text>
  <text x="80" y="820" font-size="11" fill="#333">▬ <tspan fill="#2c7be5">CANH</tspan> / <tspan fill="#e53e3e">CANL</tspan> = differential bus · <tspan fill="#f6ad55">■</tspan> = 120 Ω terminator (each bus end) · <tspan fill="#38a169">green</tspan> = local I²C · <tspan fill="#d53f8c">pink</tspan> = CAN transceiver</text>
  <text x="80" y="838" font-size="11" fill="#333">Sensors are <tspan font-weight="bold">unchanged</tspan> — the node adapts I²C → CAN. Node firmware: <tspan font-family="monospace">sensor_node.ino</tspan> · protocol: <tspan font-family="monospace">can_protocol.h</tspan></text>
</svg>
