<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="900" viewBox="0 0 1040 900" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1040" height="900" fill="#ffffff"/>

  <text x="520" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">Staircase Light Controller — UART / mmWave Option (5V USB)</text>
  <text x="520" y="56" font-size="13" text-anchor="middle" fill="#555">2× HLK-LD2410B radar (presence) + BH1750 (lux) · 5 V USB power · ESP32-S3</text>

  <!-- ============ SYSTEM OVERVIEW ============ -->
  <text x="30" y="88" font-size="16" font-weight="bold" fill="#111">1 · System overview</text>

  <!-- ESP32-S3 main box (center) -->
  <rect x="370" y="110" width="290" height="210" rx="8" fill="#ebf4ff" stroke="#2c7be5" stroke-width="2.5"/>
  <text x="515" y="140" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a56a8">ESP32-S3 SuperMini</text>
  <text x="515" y="158" font-size="10" text-anchor="middle" fill="#555">(main controller)</text>
  <g font-size="11" fill="#333">
    <text x="386" y="184">GPIO 4 · radar OUT (bottom)</text>
    <text x="386" y="204">GPIO 6 · radar OUT (top)</text>
    <text x="386" y="224">GPIO 7 · UART RX (bottom)</text>
    <text x="386" y="244">GPIO 8 · UART RX (top)</text>
    <text x="386" y="264">GPIO 9 / 10 · UART TX (config)</text>
    <text x="386" y="284">GPIO 12 / 13 · BH1750 SDA / SCL</text>
    <text x="386" y="304">GPIO 5 · LED MOSFET (PWM)</text>
  </g>

  <!-- Radar bottom (left) -->
  <rect x="80" y="110" width="190" height="130" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
  <text x="175" y="135" font-size="13" font-weight="bold" text-anchor="middle" fill="#276749">HLK-LD2410B</text>
  <text x="175" y="151" font-size="10" text-anchor="middle" fill="#555">mmWave radar · bottom</text>
  <g font-size="10" fill="#333">
    <text x="96" y="176">OUT  → GPIO 4</text>
    <text x="96" y="192">TX   → GPIO 7 (RX)</text>
    <text x="96" y="208">RX   ← GPIO 9 (TX, config)</text>
    <text x="96" y="224">VCC  → 5 V</text>
    <text x="96" y="238">GND  → GND</text>
  </g>

  <!-- Radar top (left, below) -->
  <rect x="80" y="260" width="190" height="130" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
  <text x="175" y="285" font-size="13" font-weight="bold" text-anchor="middle" fill="#276749">HLK-LD2410B</text>
  <text x="175" y="301" font-size="10" text-anchor="middle" fill="#555">mmWave radar · top</text>
  <g font-size="10" fill="#333">
    <text x="96" y="326">OUT  → GPIO 6</text>
    <text x="96" y="342">TX   → GPIO 8 (RX)</text>
    <text x="96" y="358">RX   ← GPIO 10 (TX, config)</text>
    <text x="96" y="374">VCC  → 5 V</text>
    <text x="96" y="388">GND  → GND</text>
  </g>

  <!-- BH1750 (right top) -->
  <rect x="760" y="110" width="200" height="90" rx="8" fill="#fffaf0" stroke="#d69e2e" stroke-width="2"/>
  <text x="860" y="135" font-size="13" font-weight="bold" text-anchor="middle" fill="#975a16">BH1750</text>
  <text x="860" y="151" font-size="10" text-anchor="middle" fill="#555">ambient light (I²C, real lux)</text>
  <g font-size="10" fill="#333">
    <text x="776" y="172">SDA → GPIO 12</text>
    <text x="776" y="188">SCL → GPIO 13</text>
    <text x="776" y="200">VCC → 3V3 · GND → GND</text>
  </g>

  <!-- LED + MOSFET (right, below) -->
  <rect x="760" y="220" width="200" height="90" rx="8" fill="#fdf2f8" stroke="#d53f8c" stroke-width="2"/>
  <text x="860" y="245" font-size="13" font-weight="bold" text-anchor="middle" fill="#97266d">IRLZ44N + 5 V LED strip</text>
  <g font-size="10" fill="#333">
    <text x="776" y="266">GPIO 5 → gate (10 kΩ pulldown)</text>
    <text x="776" y="282">5 V → strip (+) · strip (−) → drain · source → GND</text>
  </g>

  <!-- Connections radar -> ESP32 -->
  <g stroke="#38a169" stroke-width="1.6" fill="none">
    <line x1="270" y1="173" x2="370" y2="181"/>
    <line x1="270" y1="189" x2="370" y2="221"/>
    <line x1="270" y1="205" x2="370" y2="261"/>
    <line x1="270" y1="323" x2="370" y2="201"/>
    <line x1="270" y1="339" x2="370" y2="241"/>
    <line x1="270" y1="355" x2="370" y2="261"/>
  </g>
  <!-- BH1750 -> ESP32 -->
  <line x1="760" y1="169" x2="660" y2="281" stroke="#d69e2e" stroke-width="1.6"/>
  <line x1="760" y1="185" x2="660" y2="284" stroke="#d69e2e" stroke-width="1.6"/>
  <!-- MOSFET -> ESP32 -->
  <line x1="760" y1="263" x2="660" y2="301" stroke="#d53f8c" stroke-width="1.6"/>

  <!-- ============ RADAR DETAIL ============ -->
  <text x="30" y="450" font-size="16" font-weight="bold" fill="#111">2 · Radar wiring (one HLK-LD2410B)</text>

  <rect x="80" y="470" width="230" height="190" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
  <text x="195" y="496" font-size="13" font-weight="bold" text-anchor="middle" fill="#276749">HLK-LD2410B</text>
  <g font-size="11" fill="#333">
    <text x="96" y="526">VCC (5 V)</text>
    <text x="96" y="548">GND</text>
    <text x="96" y="570">OUT  → presence (HIGH = present)</text>
    <text x="96" y="592">TX   → UART (distance cm)</text>
    <text x="96" y="614">RX   ← config (sensing distance)</text>
  </g>
  <text x="195" y="644" font-size="9" text-anchor="middle" fill="#38a169" font-style="italic">sensitivity via HLK app or UART · sensing distance via dashboard</text>

  <rect x="480" y="470" width="270" height="120" rx="8" fill="#ebf4ff" stroke="#2c7be5" stroke-width="2"/>
  <text x="615" y="496" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a56a8">ESP32-S3 (this node)</text>
  <g font-size="11" fill="#333">
    <text x="496" y="526">GPIO 4/6  ← OUT</text>
    <text x="496" y="548">GPIO 7/8  ← TX</text>
    <text x="496" y="570">GPIO 9/10 → RX (config)</text>
    <text x="496" y="588">5 V / GND</text>
  </g>
  <line x1="310" y1="567" x2="480" y2="523" stroke="#38a169" stroke-width="1.8"/>
  <line x1="310" y1="589" x2="480" y2="545" stroke="#38a169" stroke-width="1.8"/>
  <line x1="310" y1="611" x2="480" y2="567" stroke="#38a169" stroke-width="1.8"/>

  <!-- ============ POWER (5V USB) ============ -->
  <text x="30" y="710" font-size="16" font-weight="bold" fill="#111">3 · Power — one 5 V / 2 A USB charger (no 12 V, no buck)</text>

  <!-- USB charger box -->
  <rect x="80" y="735" width="210" height="90" rx="8" fill="#f3e8ff" stroke="#6b46c1" stroke-width="2.5"/>
  <text x="185" y="762" font-size="13" font-weight="bold" text-anchor="middle" fill="#553c9a">USB charger</text>
  <text x="185" y="780" font-size="10" text-anchor="middle" fill="#555">5 V / 2 A (phone charger)</text>
  <text x="185" y="798" font-size="10" text-anchor="middle" fill="#555">→ +5 V rail (VBUS) · GND</text>

  <!-- loads box -->
  <rect x="420" y="735" width="360" height="110" rx="8" fill="#f7fafc" stroke="#4a5568" stroke-width="2"/>
  <text x="600" y="762" font-size="13" font-weight="bold" text-anchor="middle" fill="#2d3748">+5 V rail feeds everything</text>
  <g font-size="11" fill="#333">
    <text x="436" y="786">ESP32-S3 → 5 V pin</text>
    <text x="436" y="806">2× radar → VCC (5 V)</text>
    <text x="436" y="826">LED strip → (+) (USB-A VBUS)</text>
  </g>

  <!-- low-side MOSFET detail -->
  <rect x="820" y="735" width="190" height="110" rx="8" fill="#fdf2f8" stroke="#d53f8c" stroke-width="2"/>
  <text x="915" y="762" font-size="13" font-weight="bold" text-anchor="middle" fill="#97266d">Low-side switch</text>
  <g font-size="10" fill="#333">
    <text x="836" y="786">strip (−) → MOSFET drain</text>
    <text x="836" y="802">MOSFET source → GND</text>
    <text x="836" y="818">gate ← GPIO 5 (10 kΩ pulldown)</text>
  </g>

  <line x1="290" y1="780" x2="420" y2="780" stroke="#6b46c1" stroke-width="2"/>
  <line x1="780" y1="790" x2="820" y2="790" stroke="#d53f8c" stroke-width="2"/>

  <text x="520" y="875" font-size="10" text-anchor="middle" fill="#777">Power budget: strip 1–1.5 A + 2 radars ≈0.2 A + ESP32 ≈0.15 A ≈ 1.85 A max — within the 2 A charger.</text>

</svg>
