<svg xmlns="http://www.w3.org/2000/svg" width="420" height="340" viewBox="0 0 420 340" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="420" height="340" fill="#ffffff"/>
  <text x="210" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">IRLZ44N — N-Channel MOSFET (TO-220)</text>
  <text x="210" y="52" font-size="13" text-anchor="middle" fill="#555">Logic-level, 55V / 47A · front view, pins down, left→right</text>

  <!-- Body -->
  <rect x="140" y="120" width="140" height="140" rx="6" fill="#d9d9d9" stroke="#333" stroke-width="2"/>
  <!-- Tab -->
  <rect x="160" y="66" width="100" height="58" rx="4" fill="#b0b0b0" stroke="#333" stroke-width="2"/>
  <circle cx="210" cy="95" r="9" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  <text x="210" y="99" font-size="10" text-anchor="middle" fill="#333">D</text>
  <text x="210" y="82" font-size="10" text-anchor="middle" fill="#333">TAB = DRAIN</text>

  <!-- Pins -->
  <rect x="156" y="260" width="12" height="50" fill="#ccc" stroke="#333" stroke-width="1.5"/>
  <rect x="204" y="260" width="12" height="50" fill="#ccc" stroke="#333" stroke-width="1.5"/>
  <rect x="252" y="260" width="12" height="50" fill="#ccc" stroke="#333" stroke-width="1.5"/>

  <text x="162" y="330" font-size="15" font-weight="bold" text-anchor="middle" fill="#c00">G</text>
  <text x="210" y="330" font-size="15" font-weight="bold" text-anchor="middle" fill="#c00">D</text>
  <text x="258" y="330" font-size="15" font-weight="bold" text-anchor="middle" fill="#c00">S</text>

  <text x="162" y="252" font-size="12" text-anchor="middle" fill="#333">1</text>
  <text x="210" y="252" font-size="12" text-anchor="middle" fill="#333">2</text>
  <text x="258" y="252" font-size="12" text-anchor="middle" fill="#333">3</text>

  <!-- Legend -->
  <rect x="30" y="180" width="80" height="16" fill="#fff" />
  <text x="30" y="205" font-size="13" fill="#333">Pin 1 = <tspan font-weight="bold" fill="#c00">Gate</tspan></text>
  <text x="30" y="225" font-size="13" fill="#333">Pin 2 = <tspan font-weight="bold" fill="#c00">Drain</tspan> (tab too)</text>
  <text x="30" y="245" font-size="13" fill="#333">Pin 3 = <tspan font-weight="bold" fill="#c00">Source</tspan></text>
  <text x="30" y="285" font-size="12" fill="#555">This project: gate = GPIO 5</text>
  <text x="30" y="303" font-size="12" fill="#555">via 10kΩ pulldown (low-side switch)</text>
</svg>
